<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body{ margin:0; padding:0; }
  body{ width:264px; background:#14100a; color:#f0e8d6; font:13px/1.45 Inter, "Segoe UI", system-ui, sans-serif; }
  .head{ display:flex; align-items:center; gap:9px; padding:12px 14px 10px; }
  .orb{ width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 32% 30%, #f2c979, #c98b2e 72%); box-shadow:0 0 10px rgba(230,178,88,.35); flex:0 0 auto; }
  .head b{ font-size:13.5px; letter-spacing:.2px; }
  .head span{ display:block; font-size:10px; color:#b4a88f; }
  .menu{ display:flex; flex-direction:column; gap:6px; padding:0 10px 12px; }
  button{ display:flex; align-items:center; gap:9px; width:100%; box-sizing:border-box; text-align:left;
    background:#1f1a13; color:#f0e8d6; border:1px solid #3c3325; border-radius:10px; padding:9px 11px;
    font:inherit; cursor:pointer; transition:border-color .15s, background .15s; }
  button:hover{ border-color:#d8a04a; background:#282118; }
  button small{ margin-left:auto; color:#877b64; font-size:10px; }
  .foot{ padding:0 14px 12px; font-size:10.5px; color:#877b64; }
  .err{ color:#e08b6d; }
</style>
</head>
<body>
  <div class="head">
    <div class="orb"></div>
    <div><b>Ultra Pro Reader</b><span>read aloud · anywhere</span></div>
  </div>
  <div class="menu">
    <button id="btnPage">🔊 Read this page aloud <small>any site</small></button>
    <button id="btnSel">✒️ Read the selected text</button>
    <button id="btnLib">📚 Open the reader</button>
  </div>
  <div class="foot" id="msg">The page is turned into a book in your library, then read aloud with your chosen voice.</div>
  <script src="popup.js"></script>
</body>
</html>
